name: pypi-release

# Publishes sdist + wheel to PyPI after github-release completes (or on manual dispatch). Ported
# from pyramids-mesh. Needs the PYPI_PUBLISH secret; cannot succeed until pyramids-core ships the
# `pyramids.lazy_support` facade to PyPI (a published wheel must import cleanly).
#
# A release cut by `github-release` runs under GITHUB_TOKEN, and GitHub does not let a
# GITHUB_TOKEN-created event trigger another workflow — so a `release: published` trigger would
# never fire on the automated path. `workflow_run` is exempt (it fires when another workflow
# completes), so it is the signal that actually works.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['github-release']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome; only publish when the github-release
    # run succeeded and came from this repo (manual dispatch is always allowed).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      # The publish job only reads: it checks out a ref, reads releases via the API, and uploads to
      # PyPI with twine (an external service). It never pushes commits/tags/releases, so read is
      # enough — keep GITHUB_TOKEN least-privilege on a job that runs third-party build/publish tools.
      contents: read
      # download-artifact fetches the release-ref artifact from the separate github-release run,
      # which needs read access to that run's artifacts via the Actions API.
      actions: read
    steps:
      - name: Check actor is a repository admin
        # Gate the MANUAL publish path only. The workflow_run path is already tied to
        # github-release, which is itself admin-gated.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! PERMISSION=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission'); then
            echo "::error::could not verify repository permission for ${ACTOR} (GitHub API error)"
            exit 1
          fi
          echo "Permission level for ${ACTOR}: ${PERMISSION}"
          if [ "${PERMISSION}" != "admin" ]; then
            echo "::error::${ACTOR} is not a repository admin. Only admins can publish."
            exit 1
          fi

      - name: Download the release ref from the github-release run
        # workflow_run carries no custom data, and head_branch/head_sha point at the dispatched ref
        # (normally main) — which does NOT hold the bump in the manual-merge model (the bump lives
        # on the release/auto-* branch until a human merges it). github-release uploads the branch it
        # created as the `release-ref` artifact; fetch it by the triggering run's id. A delayed
        # re-run can fail here if the artifact expired (retention-days: 1) or the branch was deleted
        # after merge — that fails safe; the recovery is a fresh release dispatch.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-ref
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .release-ref

      - name: Resolve the ref to publish
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF="$(cat .release-ref/release-ref.txt)"
            echo "Release ref from github-release artifact: ${REF}"
          else
            REF="${{ github.ref_name }}"
            echo "Manual dispatch; publishing the selected ref: ${REF}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Publish the branch github-release created (from the release-ref artifact on the
          # workflow_run path, or the dispatched ref on a manual run) — NOT head_branch/head_sha,
          # which both point at the pre-bump main. `clean: true` here wipes .release-ref, but the
          # ref was already captured into the step output above.
          ref: ${{ steps.ref.outputs.ref }}

      - name: Decide whether to publish
        # Two guards, both evaluated against the resolved + checked-out ref:
        #   1. Idempotency (BOTH paths): never re-upload a version already on PyPI — that is the
        #      HTTP 400 ("File already exists") this pipeline keeps hitting (a manual dispatch from
        #      main, or a re-run after a successful publish). PyPI's JSON API returns 200 if the
        #      version exists, 404 if not. This is the guard that makes the manual dispatch safe.
        #   2. Draft gate (workflow_run path only): a github-release cut with `draft: true` still
        #      bumps the version and completes successfully, which would fire this workflow and
        #      publish an unreleased version (irreversible). /releases/tags returns published
        #      releases only, so a draft (or missing) release skips publishing.
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Anchor on `version` followed by `=` so it cannot match `version_provider` under
          # [tool.commitizen]; `-m1` then takes the [project] version line. tag_format is "$version"
          # (no v-prefix), so the version doubles as the git tag / release name.
          TAG=$(grep -m1 '^version[[:space:]]*=' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "Resolved version/tag: ${TAG}"

          # Guard 1 — idempotency: skip if ${TAG} is already published on PyPI.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/pyramids-lazy/${TAG}/json" || echo "000")
          if [ "${CODE}" = "200" ]; then
            echo "pyramids-lazy ${TAG} is already on PyPI — skipping publish (idempotent)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "${CODE}" != "404" ]; then
            echo "::error::could not query PyPI for ${TAG} (HTTP ${CODE})"
            exit 1
          fi

          # Guard 2 — draft gate (workflow_run only). Manual dispatch has no draft to worry about
          # and already passed Guard 1, so it proceeds.
          if [ "${EVENT}" = "workflow_run" ]; then
            ERR="${RUNNER_TEMP}/gh-release-check.err"
            if gh api "repos/${REPO}/releases/tags/${TAG}" >/dev/null 2>"${ERR}"; then
              echo "Published release ${TAG} found — proceeding."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            elif grep -q 'HTTP 404' "${ERR}"; then
              echo "No published release for ${TAG} (draft or not yet published) — skipping publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::could not verify release ${TAG} (GitHub API error, not a 404)"
              cat "${ERR}"
              exit 1
            fi
          else
            echo "Manual dispatch; ${TAG} not yet on PyPI — proceeding."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish sdist + wheel
        # The gate now runs on both paths (idempotency + draft), so publishing is gated solely on
        # its decision — a manual dispatch no longer bypasses it.
        if: steps.gate.outputs.publish == 'true'
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag for every
        # action in it, so 38c11108 is the dereferenced commit for pypi-release/v1.0.3,
        # github-release/v1.5.0 and mkdocs/v1.3.1 alike. Verify with
        #   git ls-remote --tags https://github.com/serapeum-org/github-actions
        uses: serapeum-org/github-actions/actions/release/pypi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pypi-release/v1.0.3
        with:
          pypi-username: __token__
          pypi-password: ${{ secrets.PYPI_PUBLISH }}
          package-manager: 'pixi'
          install-groups: 'dev'
          verify-lock: 'false'
