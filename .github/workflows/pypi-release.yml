name: pypi-release (emergency sdist-only fallback)

# Emergency manual fallback that ships ONLY the sdist to PyPI. Use this when
# bundle-pypi-wheels.yml is broken and conda-forge needs a new tarball to pick up; do NOT use it
# for normal releases. Mirrors pyramids-core.
#
# The canonical release path is bundle-pypi-wheels.yml's `release:` job, which builds + verifies +
# publishes the sdist plus the native py3-none-<platform> wheels in one workflow. It runs
# automatically on `workflow_run` when the `github-release` workflow completes. This workflow is
# dispatch-only so it never races that path (two publishers on the same release would double-publish,
# and this one builds the driver-less pure wheel — hence sdist-only here).
#
# Trigger manually: `gh workflow run pypi-release.yml`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents: write is required for the admin-gate step below: the
    # collaborators/{user}/permission REST endpoint needs push access (its sibling endpoints do,
    # and there is no read-only path), and the same gate runs under contents: write in
    # github-release.yml. Without it the gh api call 403s and the gate fails closed for everyone.
    permissions:
      contents: write
    steps:
      - name: Check actor is a repository admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Distinguish an API failure (403 scope / rate-limit / transient 5xx) from a genuine
          # non-admin, so a broken emergency path is not reported as "not admin".
          if ! PERMISSION=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission'); then
            echo "::error::could not verify repository permission for ${ACTOR} (GitHub API error)"
            exit 1
          fi
          echo "Permission level for ${ACTOR}: ${PERMISSION}"
          if [ "${PERMISSION}" != "admin" ]; then
            echo "::error::${ACTOR} is not a repository admin. Only admins can publish."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Build and publish sdist only (emergency fallback)
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag for every
        # action in it, so 961524 is the dereferenced commit for pypi-release/v1.0.4.
        uses: serapeum-org/github-actions/actions/release/pypi@961524686fb512c05ca8e4c7bfe81ba68eef4dda # pypi-release/v1.0.4
        with:
          pypi-username: __token__
          pypi-password: ${{ secrets.PYPI_PUBLISH }}
          package-manager: 'pixi'
          install-groups: 'dev'
          verify-lock: 'false'
