name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # dev: every extra (incl. the [parquet] vector stack). base: the no-[parquet] shape that
        # core's py3xx legs run in and that hid the backend-discovery bug. py311: base on 3.11, where
        # runtime_checkable isinstance behaves differently. pyramids-core comes from the dev group.
        environment: [dev, base, py311]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@961524686fb512c05ca8e4c7bfe81ba68eef4dda # pixi/v1.5.1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true
          version: v0.73.0

      # --locked asserts the committed pixi.lock matches pyproject (catches a drifted lock at setup).
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pixi run --locked -e ${{ matrix.environment }} pytest -vvv -m "not live" -p no:cacheprovider
