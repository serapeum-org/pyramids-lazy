name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Codecov's tokenless (OIDC) upload needs an id-token.
  id-token: write

# Cancel superseded PR runs, but never cancel a run on main: every commit merged to main must
# verify independently, so main gets a unique run_id group (never shared, never cancelled) while
# PRs keep the per-ref group with cancel-in-progress. Matches pyramids-core.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Full-stack (dev + the [parquet] vector extra) across every supported Python.
        environment: [py311, py312, py313, py314, py315]
        # The no-[parquet] shape (on 3.11, where the backend-discovery bug was specific) runs as one
        # extra leg on ubuntu — enough to cover the parquet-less resolution without running it across
        # the whole matrix.
        include:
          - os: ubuntu-latest
            environment: base

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@6c0a569b67c149c4648c75495544732cba2d0eca # pixi/v1.2.2
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true
          version: v0.84.2

      # The `main` task runs the suite with coverage (--cov-report=xml); --locked asserts the
      # committed pixi.lock matches pyproject (catches a drifted lock at setup).
      - name: Run tests with coverage
        env:
          MPLBACKEND: Agg
        run: pixi run --locked -e ${{ matrix.environment }} main

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5

      - name: Test Jupyter notebooks
        # rc 4 (usage/collection error) and 5 (no tests collected) are tolerated: there are no
        # example notebooks yet, so `pixi run notebooks` collects nothing — a no-op until a
        # docs/examples tree lands. Any real nbval failure still exits non-zero and fails the job.
        shell: bash
        run: |
          set +e
          pixi run -e ${{ matrix.environment }} notebooks
          rc=$?
          if [ $rc -eq 4 ] || [ $rc -eq 5 ]; then exit 0; fi
          exit $rc
