name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pyramids-core comes from the `dev` dependency group (git pin); GDAL + the lazy stack from conda.
      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@961524686fb512c05ca8e4c7bfe81ba68eef4dda # pixi/v1.5.1
        with:
          environments: dev
          activate-environment: dev
          cache: true
          version: v0.73.0

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pixi run -e dev pytest -vvv -p no:cacheprovider
