name: Deploy MkDocs

# MkDocs build + deploy workflow: the warnings-as-errors `build-strict` gate, the main-branch site
# and the versioned release docs (mike). `build-strict` runs on every event including pull
# requests, and both deploys depend on it. PR-preview *deploys* (mesh's deploy-pr job) stay
# omitted, so a pull request builds the site and uploads it as an artifact but never publishes to
# gh-pages -- a per-PR deploy would commit a whole site to the shared branch on every push.
#
# The site it deploys is `mkdocs.yml` + `docs/`. The deploy also needs the `ACTIONS_DEPLOY_TOKEN`
# secret and writes to a `gh-pages` branch that mike creates on the first successful run.

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  # The gate's reason for existing: before this, nothing built the docs on a pull request, so a
  # broken nav entry or a dangling `::: identifier` failed the DEPLOY after merging instead of the
  # PR that introduced it. '**' rather than [main] so a stacked PR is checked too, as in core.
  # Only `build-strict` becomes reachable from a pull request -- every deploy job's `if:` demands
  # a push, a release or a workflow_run, none of which a pull request can satisfy.
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

jobs:
  # Gate every deploy on a warnings-as-errors build. The mkdocs-deploy action builds NON-STRICT
  # (`mkdocs.yml` sets no `strict:` key, and mkdocs defaults it to false), so a broken nav entry, a
  # dangling anchor or a malformed docstring publishes silently -- this fails the run instead.
  #
  # This check is a restoration, not a new idea: it lived in lint.yml as a `docs` job from 4b70d7e
  # (#14, which closed #17 "nothing validates the docs site before merge") until 8e383b6 (#43)
  # rewrote lint.yml and the job did not survive. It sits here rather than back in lint.yml because
  # here it also gates the deploys, which the lint.yml placement never did.
  build-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This workflow grants contents+pages write at the top level for the deploy jobs. A pull
    # request reaches THIS job, so it drops to read-only: it needs nothing else, and the deploys
    # hold ACTIONS_DEPLOY_TOKEN.
    permissions:
      contents: read
    steps:
      # No explicit ref, which is what keeps fork-controlled code out: on a pull_request
      # checkout's default is the merge commit (`refs/pull/<n>/merge`), not the fork's head.
      # On the other paths it is the pushed/tagged commit, and on a workflow_run the default
      # branch -- the same tree deploy-release resolves to there (see its own note).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same pixi `docs` environment the deploy jobs install (`install-groups: 'docs'`), so the
      # gate and the deploy cannot drift onto different dependency sets.
      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@6c0a569b67c149c4648c75495544732cba2d0eca # pixi/v1.2.2
        with:
          environments: docs
          activate-environment: docs
          cache: true
          version: v0.84.2

      - name: Build the docs site (strict)
        # --strict turns mkdocs/griffe warnings into errors -- that is the whole gate. --locked, as
        # in tests.yml's `main`: without it a drifted pixi.lock is silently re-solved and the gate
        # would pass against dependencies the lock does not describe. --site-dir keeps the output
        # out of the checkout so nothing can be committed by accident.
        run: pixi run --locked -e docs mkdocs build --strict --site-dir /tmp/site

      # A pull request builds the site but does not publish it. Reviewers who want to see the
      # rendered pages download them here instead of from a gh-pages preview.
      - name: Upload the built site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-pr-${{ github.event.pull_request.number }}
          path: /tmp/site
          retention-days: 7

  deploy-main:
    needs: build-strict
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
        with:
          trigger: 'main'
          package-manager: 'pixi'
          install-groups: 'docs'
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    needs: build-strict
    # Security: when triggered via `workflow_run`, require that the upstream workflow ran from the
    # base repository (not a fork) so untrusted code never runs in a context holding the deploy token.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_repository.fork == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # head_branch (not head_sha) so a branch TIP is used rather than a captured commit.
          # CAVEAT, verified against github-release.yml: that workflow is workflow_dispatch-only,
          # so this event's head_branch is the DISPATCH ref -- normally `main` -- not the
          # `release/auto-*` branch it creates. Its auto-merge is also disabled (the release PR is
          # merged by hand), so on this path `main` does not yet carry the version bump or the
          # new change-log entry, and the versioned docs published here are the pre-release tree.
          # bundle-pypi-wheels.yml solves the same problem by reading github-release's `release-ref`
          # artifact; doing that here is tracked separately and is not part of the docs gate.
          # The fork guard in `if:` above keeps this from checking out untrusted code.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Extract version from pyproject.toml
        id: version
        # Anchor on `version` followed by `=` so it cannot match `version_provider` under
        # [tool.commitizen]; same fix as pypi-release.yml.
        run: |
          VERSION=$(grep -m1 '^version[[:space:]]*=' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
        with:
          trigger: 'release'
          package-manager: 'pixi'
          install-groups: 'docs'
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
          release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
          mike-alias: 'latest'
