name: Pure Wheel - Build & Test

# Ported from pyramids-mesh. DORMANT until pyramids-core ships the `pyramids.lazy_support` facade
# to PyPI: this builds the wheel and installs it with `--only-binary=:all:`, which pulls the
# RELEASED pyramids-core — but `pyramids_lazy._seam` requires the (still unreleased) facade, so
# `import pyramids_lazy` raises "upgrade pyramids-core" today. For that reason the push-to-main
# trigger is removed; it runs only on manual dispatch and when github-release calls it as a gate.
# Re-add `push: branches: [main]` once a released pyramids-core satisfies the seam.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / ref to build and test (defaults to the ref selected in the UI)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      branch:
        description: "Ref to build and test (passed by the calling workflow)"
        required: false
        default: ""
        type: string

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Pixi
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: dev
          activate-environment: dev
          cache: true
          version: v0.73.0

      - name: Build wheel
        run: pixi run -e dev python -m build --wheel --outdir dist/

      - name: Verify package layout in wheel
        # This package ships no data files, so the check is that the package and its public backend
        # module are present: a src-layout or packaging regression that dropped them would still
        # build an installable but empty wheel.
        run: |
          LISTING=$(pixi run -e dev python -m zipfile -l dist/*.whl)
          echo "$LISTING" | grep "pyramids_lazy/__init__.py"
          echo "$LISTING" | grep "pyramids_lazy/backend.py"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

  test-wheel-core:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel (no extras)
        # --only-binary=:all: is the whole point of a pure-wheel test: every runtime dependency
        # (pyramids-core, dask, zarr, kerchunk, h5py, ...) must install from a published wheel on
        # this OS / Python, never build from an sdist. pyramids-core vendors osgeo in its wheel, so
        # a bare install is importable without a separate GDAL.
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}" --only-binary=:all:

      - name: Verify package import
        # import pyramids_lazy runs its `_seam` facade check against the installed pyramids-core.
        # This is the step blocked until core releases the facade (see the header).
        run: python -c "import pyramids_lazy; print(pyramids_lazy.__version__)"

      - name: Install test runner
        run: "pip install pytest pytest-env pytest-mock --only-binary=:all:"

      - name: Run tests (not live)
        # -o pythonpath= clears the `pythonpath = [".", "src"]` setting so the tests import the
        # INSTALLED wheel, not the source tree. live tests need network and are deselected.
        run: pytest -vvv -sv -o pythonpath= -m "not live" tests/

  test-wheel-extras:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
        extra:
          - { name: parquet, pip_extra: "parquet", module: "pyramids_lazy._vector_read" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel with only [${{ matrix.extra.name }}] extra
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}[${{ matrix.extra.pip_extra }}]"

      - name: Verify package import
        run: python -c "import pyramids_lazy; print(pyramids_lazy.__version__)"

      - name: Verify the [${{ matrix.extra.name }}] module imports with its extra installed
        # The module hard-imports its backing library (dask-geopandas) and raises the branded
        # LazyExtraNotInstalled when the extra is absent; with the extra installed it must import
        # cleanly.
        run: python -c "import pyramids_lazy; import ${{ matrix.extra.module }}"

      - name: Install test runner
        # --only-binary=:all: here too: the whole workflow proves everything installs from published
        # wheels, so the test runner must not quietly build from an sdist (matches test-wheel-core).
        run: "pip install pytest pytest-env pytest-mock --only-binary=:all:"

      - name: Run the suite with the [${{ matrix.extra.name }}] extra present
        shell: bash
        run: pytest -vvv -sv -o pythonpath= -m "not live" tests/ || [ $? -eq 5 ]
