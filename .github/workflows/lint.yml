name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@961524686fb512c05ca8e4c7bfe81ba68eef4dda # pixi/v1.5.1
        with:
          environments: dev
          activate-environment: dev
          cache: true
          version: v0.73.0

      - name: Lint and format check
        run: pixi run -e dev lint

      - name: Type check
        run: pixi run -e dev typecheck

      # The moved modules carry their own `>>>` examples; without this they execute nowhere.
      - name: Doctests (src)
        run: pixi run -e dev pytest --doctest-modules src -p no:cacheprovider
