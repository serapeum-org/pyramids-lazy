name: github-release

# Manual release cutter (commitizen bump -> tag -> GitHub release -> auto-merged PR back onto the
# base branch), ported from pyramids-mesh. Dispatch-only, so it never runs on ordinary CI. It gates
# on pure-wheel-test, which installs the released pyramids-core from PyPI; that gate is unblocked now
# core 0.79.0 ships the `pyramids.lazy_support` facade this backend requires.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: "Base branch to release from and auto-merge the release back into"
        required: false
        default: "main"
      increment:
        description: "Version increment type"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      prerelease_type:
        description: "Prerelease type"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
        default: "none"
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

jobs:
  # Build the wheel and run it across the OS/Python matrix BEFORE cutting anything, so a wheel
  # that cannot install or import on a supported target blocks the tag/release/PyPI chain.
  pure-wheel-test:
    uses: ./.github/workflows/pure-wheel-test.yml
    with:
      branch: ${{ inputs.release-branch }}

  release:
    needs: pure-wheel-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release-branch }}

      - name: Check actor is a repository admin
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          echo "Permission level for ${{ github.actor }}: $PERMISSION"
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::${{ github.actor }} is not a repository admin. Only admins can trigger releases."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cut the bump/tag/release on a throwaway branch, never straight on `release-branch`. The
      # commitizen action below tags the bump commit BEFORE anything merges; if that commit is later
      # reached via a squash or rebase merge its SHA changes, so the tag would point at a commit that
      # is not an ancestor of `release-branch` — an orphaned tag (exactly what happened to 0.1.1).
      # The final step instead opens a PR from this branch and merges it with a MERGE COMMIT, which
      # keeps the tagged commit reachable from `release-branch`.
      - name: Create the throwaway release branch
        id: release_branch
        run: |
          NAME="release/auto-${{ github.run_id }}-${{ github.run_attempt }}"
          git switch -c "$NAME"
          git push -u origin "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with Commitizen
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag for every
        # action in it, so 38c11108 is the dereferenced commit for github-release/v1.5.0,
        # pypi-release/v1.0.3 and mkdocs/v1.3.1 alike. Verify with
        #   git ls-remote --tags https://github.com/serapeum-org/github-actions
        uses: serapeum-org/github-actions/actions/release/github@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # github-release/v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          increment: ${{ github.event.inputs.increment }}
          prerelease-type: ${{ github.event.inputs.prerelease_type }}
          draft: ${{ github.event.inputs.draft }}
          package-manager: pixi
          # Must match the pixi pinned in tests.yml: the release action runs `pixi lock` and folds
          # the result into the bump commit, so a floating version could write a lock format the
          # matrix cannot read.
          package-manager-version: v0.84.2
          install-groups: "dev"

      # Land the bump/changelog/tag on `release-branch` automatically. `--merge` forces a MERGE
      # COMMIT (never squash/rebase), so the tagged bump commit becomes an ancestor of the base and
      # the tag is never orphaned. `main` is unprotected and repo auto-merge is disabled, so we merge
      # immediately; the retry only rides out GitHub still computing mergeability right after create.
      - name: Open and merge the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_BRANCH="${{ steps.release_branch.outputs.name }}"
          BASE_BRANCH="${{ inputs.release-branch }}"

          # The tag the action just created sits on HEAD; use it for the PR title when present.
          VERSION="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          TITLE="release: land ${VERSION:-the version bump, changelog and tag} on ${BASE_BRANCH}"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "$TITLE" \
            --body "Automated release PR. The tag was cut on \`$HEAD_BRANCH\`; this merges it into \`$BASE_BRANCH\` with a merge commit so the tagged commit is an ancestor of \`$BASE_BRANCH\` and the tag is never orphaned. Do not squash or rebase."

          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$HEAD_BRANCH" --merge --delete-branch; then
              echo "Release PR merged into ${BASE_BRANCH}."
              exit 0
            fi
            echo "Merge not ready yet (attempt ${attempt}); waiting for mergeability..."
            sleep 10
          done
          echo "::error::Release PR for ${HEAD_BRANCH} could not be merged into ${BASE_BRANCH}."
          exit 1
