name: github-release

# Manual release cutter (commitizen bump -> tag -> GitHub release -> auto-merged PR onto main),
# ported from pyramids-mesh. Dispatch-only, so it never runs on ordinary CI. It gates on
# pure-wheel-test, which installs the released pyramids-core from PyPI; that gate is unblocked now
# core 0.79.0 ships the `pyramids.lazy_support` facade this backend requires.
#
# Release-branch model: `release-branch` is the branch the release is cut on (the entry point). Leave
# it empty and the `prepare` job creates one from the tip of main and uses it for everything, exactly
# as if it had been passed. `prepare` runs FIRST so pure-wheel-test and the bump/tag/release all run
# on that ONE branch (test what you release). The branch is then merged into main with a MERGE COMMIT,
# so the tagged commit is always an ancestor of main and the tag is never orphaned (as 0.1.1 was).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: "Branch to cut the release on. Leave empty to create one from the tip of main."
        required: false
        default: ""
      increment:
        description: "Version increment type"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      prerelease_type:
        description: "Prerelease type"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
        default: "none"
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

jobs:
  # Resolve the release branch BEFORE anything builds or tests, so pure-wheel-test and the release
  # job run on the SAME branch. Admins only. When `release-branch` is empty, create one from the tip
  # of main and use it exactly as if it had been passed.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - name: Check actor is a repository admin
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          echo "Permission level for ${{ github.actor }}: $PERMISSION"
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::${{ github.actor }} is not a repository admin. Only admins can trigger releases."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve or create the release branch
        id: resolve
        run: |
          set -euo pipefail
          GIVEN="${{ inputs.release-branch }}"
          if [ -n "$GIVEN" ]; then
            echo "Using the given release branch: $GIVEN"
            BRANCH="$GIVEN"
          else
            BRANCH="release/auto-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "No release branch given; creating $BRANCH from the tip of main"
            git switch -c "$BRANCH"
            git push -u origin "$BRANCH"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  # Build the wheel and run it across the OS/Python matrix on the SAME branch the release is cut on,
  # so a wheel that cannot install or import on a supported target blocks the tag/release/PyPI chain.
  pure-wheel-test:
    needs: prepare
    uses: ./.github/workflows/pure-wheel-test.yml
    with:
      branch: ${{ needs.prepare.outputs.branch }}

  release:
    needs: [prepare, pure-wheel-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Create GitHub Release with Commitizen
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag for every
        # action in it, so 38c11108 is the dereferenced commit for github-release/v1.5.0,
        # pypi-release/v1.0.3 and mkdocs/v1.3.1 alike. Verify with
        #   git ls-remote --tags https://github.com/serapeum-org/github-actions
        uses: serapeum-org/github-actions/actions/release/github@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # github-release/v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          increment: ${{ github.event.inputs.increment }}
          prerelease-type: ${{ github.event.inputs.prerelease_type }}
          draft: ${{ github.event.inputs.draft }}
          package-manager: pixi
          # Must match the pixi pinned in tests.yml: the release action runs `pixi lock` and folds
          # the result into the bump commit, so a floating version could write a lock format the
          # matrix cannot read.
          package-manager-version: v0.84.2
          install-groups: "dev"

      # Land the bump/changelog/tag on main automatically. `--merge` forces a MERGE COMMIT (never
      # squash/rebase), so the tagged bump commit becomes an ancestor of main and the tag is never
      # orphaned. main is unprotected and repo auto-merge is disabled, so we merge immediately; the
      # retry only rides out GitHub still computing mergeability right after create.
      - name: Open and merge the release PR into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_BRANCH="${{ needs.prepare.outputs.branch }}"

          if [ "$HEAD_BRANCH" = "main" ]; then
            echo "Release was cut on main; nothing to merge back."
            exit 0
          fi

          # The tag the action just created sits on HEAD; use it for the PR title when present.
          VERSION="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          TITLE="release: land ${VERSION:-the version bump, changelog and tag} on main"

          gh pr create \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "$TITLE" \
            --body "Automated release PR. The tag was cut on \`$HEAD_BRANCH\`; this merges it into main with a merge commit so the tagged commit is an ancestor of main and the tag is never orphaned. Do not squash or rebase."

          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$HEAD_BRANCH" --merge --delete-branch; then
              echo "Release PR merged into main."
              exit 0
            fi
            echo "Merge not ready yet (attempt ${attempt}); waiting for mergeability..."
            sleep 10
          done
          echo "::error::Release PR for ${HEAD_BRANCH} could not be merged into main."
          exit 1
