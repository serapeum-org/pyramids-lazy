name: github-release

# Manual release cutter (commitizen bump -> tag -> GitHub Release -> a release PR opened for MANUAL
# merge), ported from pyramids-mesh. Dispatch-only, so it never runs on ordinary CI. It gates on
# pure-wheel-test, which installs the released pyramids-core from PyPI; that gate is unblocked now
# core 0.79.0 ships the `pyramids.lazy_support` facade this backend requires; the floor is 0.80.0,
# which additionally brands the lazy-vector install hint with this distribution's extra.
#
# Release-branch model: `release-branch` is the branch the release is cut on (the entry point). Leave
# it empty and the `prepare` job creates one from the tip of main and uses it for everything, exactly
# as if it had been passed. `prepare` runs FIRST so pure-wheel-test and the bump/tag/release all run
# on that ONE branch. (pure-wheel-test builds the pre-bump tip; the bump only adds the
# version/changelog/lockfile commit, so the tested and released trees differ only by that commit.)
#
# EVERY TAG THIS WORKFLOW HAS CUT IS ORPHANED OFF MAIN. main's ruleset sets
# allowed_merge_methods: ["squash"] and requires one review, so this workflow cannot land the release
# PR itself, and the squash that lands it rewrites the commit SHA — leaving the tag on a commit that
# is not an ancestor of main. 0.1.0, 0.1.1 and 0.2.0 are all orphaned this way (verify with
# `git merge-base --is-ancestor <tag> origin/main`).
#
# Repository admins hold bypass_mode: always on that ruleset, and this workflow is admin-gated — but
# whether ruleset bypass also lifts allowed_merge_methods, or only the review requirement, is
# UNTESTED. Do not assume a merge commit is available until someone proves it; that is the open
# question in #51. Deciding the fix is #29: Route A adds the Actions app as a bypass actor (#51,
# deferred), Route B tags after the merge (upstream github-actions#51, shipped as
# github-release/v1.6.0's `skip-tag`, plus github-actions#57).
#
# On ANY failure the job goes red and PyPI is not published (the consumer gates on this run's
# success). `cleanup-on-failure` then deletes the throwaway `release/auto-*` branch. The tag and
# GitHub Release, if the failure came after they were cut, are left in place for inspection —
# removing those is a judgement call, not a cleanup.

permissions:
  contents: read

# Serialize releases: one release runs at a time (a second dispatch queues, it does not cancel).
# NOTE this does NOT prevent a duplicate-version/tag collision: until a release PR is merged, main is
# still unbumped, so a second release dispatched before that merge recomputes the SAME version and
# fails at tag push. Rule: merge each release PR into main before dispatching the next. Releases are
# rare and admin-only, so queue rather than cancel.
concurrency:
  group: github-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: "Branch to cut the release on. Leave empty to create one from the tip of main."
        required: false
        default: ""
      increment:
        description: "Version increment type"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      prerelease_type:
        description: "Prerelease type"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
        default: "none"
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

jobs:
  # Resolve the release branch BEFORE anything builds or tests, so pure-wheel-test and the release
  # job run on the SAME branch. Admins only. When `release-branch` is empty, create one from the tip
  # of main and use it exactly as if it had been passed.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      # 'true' only when THIS run created the branch. cleanup-on-failure deletes a branch only when
      # this says so, rather than inferring ownership from the `release/auto-*` name -- an
      # operator-supplied branch that happens to match that pattern is not ours to delete.
      created: ${{ steps.resolve.outputs.created }}
    steps:
      - name: Check actor is a repository admin
        # Every `${{ }}` below reaches the shell through `env`, never through the script body: GitHub
        # expands an expression into the script *before* bash parses it, so an interpolated value is
        # read as shell source rather than as data. Matches Digital-Earth's copy of this step.
        run: |
          PERMISSION=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission')
          echo "Permission level for $ACTOR: $PERMISSION"
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::$ACTOR is not a repository admin. Only admins can trigger releases."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve or create the release branch
        id: resolve
        env:
          GIVEN_BRANCH: ${{ inputs.release-branch }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Normalise a fully-qualified ref so `refs/heads/main` cannot slip past the main check.
          GIVEN_BRANCH="${GIVEN_BRANCH#refs/heads/}"

          # Reject main up front. main's ruleset requires a PR, so the bump push would be refused
          # mid-release, after the branch/tag work has already started. Fail here instead.
          if [ "$GIVEN_BRANCH" = "main" ]; then
            echo "::error::Cannot release on 'main' (its ruleset rejects the bump push). Leave release-branch empty to auto-create one."
            exit 1
          fi

          if [ -n "$GIVEN_BRANCH" ]; then
            # Reject anything that is not a legal branch name before it reaches ls-remote, where a
            # glob would be matched rather than looked up ("*" resolves against every ref). Also
            # catches whitespace, "..", a leading "-" and the other refname rules.
            git check-ref-format --branch "$GIVEN_BRANCH" >/dev/null 2>&1 \
              || { echo "::error::release-branch '$GIVEN_BRANCH' is not a valid branch name"; exit 1; }

            # Must be the FULL refspec. `ls-remote --heads origin <name>` matches on any trailing
            # path segment, so a nonexistent "foo" validates against refs/heads/ci/foo -- the guard
            # passed exactly the typos it was added to catch. `--exit-code origin refs/heads/<name>`
            # distinguishes correctly: 0 found, 2 absent.
            set +e
            git ls-remote --exit-code origin "refs/heads/$GIVEN_BRANCH" >/dev/null 2>&1
            RC=$?
            set -e
            case "$RC" in
              0) ;;
              2) echo "::error::release-branch '$GIVEN_BRANCH' does not exist on origin"; exit 1 ;;
              # Any other code is a transport/auth failure, not a missing branch. Reporting it as
              # "does not exist" sends the operator hunting for the wrong problem.
              *) echo "::error::could not reach origin to verify '$GIVEN_BRANCH' (git ls-remote exit $RC)"; exit 1 ;;
            esac
            echo "Using the given release branch: $GIVEN_BRANCH"
            BRANCH="$GIVEN_BRANCH"
            CREATED=false
          else
            BRANCH="release/auto-${RUN_ID}-${RUN_ATTEMPT}"
            echo "No release branch given; creating $BRANCH from the tip of main"
            git switch -c "$BRANCH"
            git push -u origin "$BRANCH"
            CREATED=true
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

  # Build the wheel and run it across the OS/Python matrix on the SAME branch the release is cut on,
  # so a wheel that cannot install or import on a supported target blocks the tag/release/PyPI chain.
  pure-wheel-test:
    needs: prepare
    uses: ./.github/workflows/pure-wheel-test.yml
    with:
      branch: ${{ needs.prepare.outputs.branch }}

  release:
    needs: [prepare, pure-wheel-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Create GitHub Release with Commitizen
        # serapeum-org/github-actions is a monorepo: one commit carries the release tag for every
        # action in it, so 38c11108 is the dereferenced commit for github-release/v1.5.0,
        # pypi-release/v1.0.3 and mkdocs/v1.3.1 alike. Verify with
        #   git ls-remote --tags https://github.com/serapeum-org/github-actions
        uses: serapeum-org/github-actions/actions/release/github@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # github-release/v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          increment: ${{ inputs.increment }}
          prerelease-type: ${{ inputs.prerelease_type }}
          draft: ${{ inputs.draft }}
          package-manager: pixi
          # Must match the pixi pinned in tests.yml: the release action runs `pixi lock` and folds
          # the result into the bump commit, so a floating version could write a lock format the
          # matrix cannot read.
          package-manager-version: v0.84.2
          install-groups: "dev"

      # Hand the released commit to bundle-pypi-wheels.yml — the only workflow that reads this
      # artifact. (pypi-release.yml is a dispatch-only emergency sdist fallback and never reads it.)
      # bundle-pypi-wheels is triggered by `workflow_run`, whose payload carries no custom data and
      # whose head_branch/head_sha point at the dispatched ref (normally main) — which does NOT hold
      # the bump in the manual-merge model. The artifact is the one channel that crosses the
      # workflow_run boundary; the consumer downloads it by run id and checks it out.
      #
      # Record the SHA, not the branch name: the repo deletes the release branch when the PR merges,
      # and a branch name would then resolve to nothing. The SHA keeps resolving because the tag cut
      # here still points at it. (It is NOT reachable from main — the squash merge rewrites the SHA;
      # see the orphaned-tag note in the header.)
      #
      # RECOVERY: while the artifact is live, re-run bundle-pypi-wheels' failed jobs — that replays
      # the same workflow_run payload, so the publish gate still fires and the SAME version is built
      # with no re-bump. A plain workflow_dispatch of that workflow will NOT publish: its release job
      # requires `workflow_run` (or dry_run_release, which stops before uploading). Once the artifact
      # has expired, a fresh release dispatch is needed, which cuts the NEXT version.
      # Assert the bump actually landed before anything downstream trusts HEAD. The shared action
      # has a recovery path that retries the bump with `cz bump --files-only`, which writes the
      # version files and changelog but creates NO commit and NO tag, warns, and still exits 0. On
      # that path HEAD is the PRE-BUMP tip, so recording it would publish the previous version --
      # which is how 0.1.1 was re-uploaded to PyPI and rejected with HTTP 400. Fail here instead.
      - name: Verify the bump commit and tag landed
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::could not resolve HEAD on the release branch"
            exit 1
          fi

          # HEAD must be exactly tagged. The action amends the bump commit during its lockfile fold
          # and force-moves the tag onto the amended commit, so after a successful run the two agree.
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            echo "::error::HEAD ($HEAD_SHA) carries no tag -- the version bump did not land (see the action's --files-only recovery path). Refusing to record a release ref."
            exit 1
          fi

          # The tag must also match the version the tree now declares, so a stale tag reachable from
          # HEAD cannot be mistaken for this release's tag.
          VERSION="$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag ($TAG) does not match pyproject version ($VERSION); refusing to record a release ref"
            exit 1
          fi

          echo "verified: HEAD $HEAD_SHA is tagged $TAG and matches pyproject version $VERSION"

      - name: Record the released commit for the downstream consumer
        run: git rev-parse HEAD > release-ref.txt

      - name: Upload the release ref for pypi-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ref
          path: release-ref.txt
          # 7 days, not 1: a delayed re-publish on the workflow_run path must still find the artifact.
          retention-days: 7
          if-no-files-found: error

      # Open the release PR into main. Auto-merge is DISABLED: main is governed by a ruleset that
      # allows squash-only merges and requires a review, so the workflow cannot land a merge commit
      # unattended. The PR is opened here and MERGED MANUALLY at the end. Re-enable the merge loop
      # below once the release model is reworked (see planning/release-tag-after-merge-proposal.md).
      - name: Open the release PR into main (merge manually)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          HEAD_BRANCH="$BRANCH"

          # The tag the action just created sits on HEAD; use it for the PR title when present.
          VERSION="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          TITLE="release: land ${VERSION:-the version bump, changelog and tag} on main"

          # Create the PR only if one does not already exist for this branch, so a re-run does not
          # abort here on "a pull request already exists". NOTE: the supported recovery for a failed
          # release is a fresh DISPATCH (new run_id => fresh branch), NOT GitHub's "Re-run failed
          # jobs" — a re-run re-invokes commitizen on the already-bumped branch and double-bumps the
          # version. (Making the bump itself idempotent is tracked in #29.)
          if gh pr view "$HEAD_BRANCH" --json number >/dev/null 2>&1; then
            echo "A PR for ${HEAD_BRANCH} already exists."
          else
            gh pr create \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "$TITLE" \
              --body "Automated release PR. The tag was cut on \`$HEAD_BRANCH\`; merge it into main MANUALLY. NOTE: main allows squash merges only, and the squash rewrites the commit SHA, so the tag will NOT be an ancestor of main once this lands. That is the known, expected outcome today — see #29 for the fix. Do not hold this PR waiting for a merge-commit option."
          fi

          echo "Release PR for ${HEAD_BRANCH} is open; merge it manually into main."

          # --- AUTO-MERGE DISABLED (PR is merged manually at the end) -----------------------------
          # for attempt in 1 2 3 4 5 6; do
          #   if gh pr merge "$HEAD_BRANCH" --merge; then
          #     echo "Release PR merged into main."
          #     exit 0
          #   fi
          #   # A failed `gh pr merge` can still have landed the merge (transient error after the
          #   # merge, or a prior attempt). Treat an already-MERGED PR as success so we never fail a
          #   # merge that actually happened — a false failure here would tempt a re-dispatch and
          #   # double-bump on top of the already-merged version.
          #   STATE="$(gh pr view "$HEAD_BRANCH" --json state --jq .state 2>/dev/null || true)"
          #   if [ "$STATE" = "MERGED" ]; then
          #     echo "Release PR already merged into main."
          #     exit 0
          #   fi
          #   echo "Merge not ready yet (attempt ${attempt}); waiting for mergeability..."
          #   sleep 10
          # done
          # echo "::error::Release PR for ${HEAD_BRANCH} could not be merged into main."
          # exit 1

      # Branch cleanup is DISABLED while auto-merge is off: the release branch must survive until the
      # PR is merged MANUALLY (this step runs on success(), which is now reached just by opening the
      # PR, so leaving it enabled would delete the branch out from under the open PR). The repo's
      # delete_branch_on_merge removes the branch after the manual merge instead.
      # - name: Delete the merged release branch
      #   if: ${{ success() && needs.prepare.outputs.branch != 'main' }}
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     BRANCH="${{ needs.prepare.outputs.branch }}"
      #     git push origin --delete "$BRANCH" || echo "branch ${BRANCH} already removed; nothing to delete"

  # Delete the branch `prepare` created when a release fails or is cancelled BEFORE the tag was cut,
  # so failed attempts stop littering the remote (runs 43784168924 and 43905004962 both had to be
  # cleaned up by hand). It deletes a branch only when all of these hold: this run created it
  # (`prepare.outputs.created`), no open PR targets it, and its tip carries no tag — the last check
  # made against origin inside the step, not from a job output. Once the tag exists the branch is
  # kept, because the tag and GitHub Release are left in place on failure and that branch holds the
  # only copy of the commit they point at.
  cleanup-on-failure:
    # `pure-wheel-test` is not listed: it is an ancestor through `release`, and `failure()` covers
    # the whole dependency chain, so naming it again adds nothing.
    needs: [prepare, release]
    # Two conditions here; the "was it tagged?" test is done inside the step against origin, NOT
    # from a job output -- see the step body for why.
    #   failure() || cancelled()  -- failure() alone is false for a cancelled run, which used to
    #                                leave the branch behind on every cancel.
    #   created == 'true'         -- only ever delete a branch THIS run created.
    if: >-
      ${{ (failure() || cancelled())
          && needs.prepare.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete the orphaned auto-created release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          # Belt and braces. Ownership is already established by the job's
          # `prepare.outputs.created == 'true'` condition; this only refuses to act on a name that
          # does not look like one we mint, in case that output is ever wired up wrong.
          case "$BRANCH" in
            release/auto-*) ;;
            *) echo "Not an auto-created branch name ($BRANCH); leaving it."; exit 0 ;;
          esac

          # --repo is mandatory: this job has no checkout, and `gh` resolves the repository from
          # --repo, GH_REPO or a git remote -- never from GITHUB_REPOSITORY. Without it the call
          # exits 1 ("failed to run git: fatal: not a git repository") on every run, and swallowing
          # that error made this guard unreachable, so the branch was deleted even under an open PR.
          # `pr list --state open` rather than `pr view`, because `pr view <branch>` also resolves
          # closed and merged PRs, which would block cleanup of a reused branch name forever.
          OPEN_PRS="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "An open PR exists for $BRANCH; leaving the branch for the PR."
            exit 0
          fi

          # Never delete a branch whose tip is tagged. Once the bump commit carries a tag, this
          # branch holds the only copy of it -- the tag and GitHub Release are deliberately kept on
          # failure -- so deleting it strands the tag and makes the next dispatch recompute the same
          # version and collide.
          #
          # Asked of origin, NOT taken from a job output. An earlier attempt gated on a `tagged`
          # output written by the release job's verify step, which fails twice over: the shared
          # action pushes the tag and creates the Release internally, several steps BEFORE that
          # verify step runs, so a failure in that window leaves the tag on origin with the output
          # unset; and a failed job's outputs are not documented to reach a dependent job at all, so
          # the guard could be inert exactly when it is needed. Querying origin is immune to both.
          TIP="$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$TIP" ]; then
            echo "branch $BRANCH is already gone; nothing to delete"
            exit 0
          fi
          if gh api "repos/$REPOSITORY/git/matching-refs/tags" --jq '.[].object.sha' | grep -qx "$TIP"; then
            echo "$BRANCH tip ($TIP) is tagged; keeping the branch so the tag stays reachable."
            exit 0
          fi

          echo "Deleting orphaned release branch $BRANCH (tip $TIP, untagged)"
          # Classify by the ACTUAL responses, measured against the API:
          #   deleting a ref that does not exist -> 422 "Reference does not exist"
          #   deleting in a repo we cannot reach -> 404 "Not Found"
          # So 422 is the benign already-gone case and 404 is a real failure. A previous revision
          # had these the wrong way round: it hard-failed on the benign case and swallowed the
          # permission error as "already gone".
          if ! ERR="$(gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$BRANCH" 2>&1)"; then
            if printf '%s' "$ERR" | grep -q 'Reference does not exist'; then
              echo "branch $BRANCH already gone; nothing to delete"
            else
              # Printed on its own lines first: an ::error:: annotation keeps only the first line.
              printf 'failed to delete %s:\n%s\n' "$BRANCH" "$ERR"
              echo "::error::failed to delete $BRANCH (see the log line above for the API response)"
              exit 1
            fi
          fi
