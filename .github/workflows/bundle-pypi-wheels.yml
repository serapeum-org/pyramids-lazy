name: Bundle PyPI Wheels

# Builds pyramids-lazy's OWN wheel as a native `py3-none-<platform>` wheel carrying the compiled
# OGR-Parquet driver + its Arrow runtime in `pyramids_lazy/gdalplugins/`. The driver is linked
# against the libgdal inside a published pyramids-core wheel (not relinked after the fact); the
# rationale is in planning/parquet-native-wheel-port-plan.md and issue #4.
#
# The wheel is interpreter-independent (the plugin loads via GDAL_DRIVER_PATH, nothing links
# libpython), so it is ONE wheel per platform, not per CPython -- see setup.py for the forced
# `py3-none-<plat>` tag. The `release` job below is the canonical publisher (sdist + wheels to the
# GitHub release and PyPI on a successful github-release). manylinux x86_64 + aarch64, macOS arm64/x86_64,
# win_amd64
# follow (plan Phasing). musllinux and win_arm64 are NOT companion targets: conda-forge ships
# no musl / win-arm64 libgdal-core, so fetch_cpl_config.py has no cpl_config.h source for
# them, and musl's VSI_STAT64_T etc. differ from glibc so the glibc header cannot be reused.
# For win_arm64 the route is to enable arrow+parquet in core's ci/vcpkg.json so the driver is
# compiled INTO core's own libgdal there -- a pyramids-core change. musl Parquet would likewise
# need core to carry the driver. Both get the pure backend + branded hint until then.

permissions:
  contents: read

# Triggers mirror pyramids-core's bundle-pypi-wheels.yml: build on every push to main, on a PR
# that touches the build, after a release, and on manual dispatch. The `release` job publishes the
# built sdist + wheels to the GitHub release and PyPI on a successful github-release
# (workflow_run); a plain push or pull request builds + verifies only (the release job skips).
on:
  push:
    branches: [main]
  # The native wheel cannot be re-created on demand -- it is a compiled OGR-Parquet driver linked
  # against the libgdal inside a published core wheel, built by three separate per-platform scripts
  # -- so verify.py has to run while a change can still be revised cheaply. It used to run for the
  # first time on the push to main: run 44936415149 (PR #43's merge commit) failed four build legs
  # and `verify windows AMD64` there, and PR #48 existed only to repair it. The `paths` filter keeps
  # the ~86 job-minutes off a PR that cannot change the artifact. Nothing in this workflow is
  # cached, so a PR pays what a push pays -- there is no warm entry for it to miss. (86 is this
  # branch's own measured pull_request run, 45890484216; the earlier push run 45063994353 was 95,
  # the difference being Windows run-to-run variance, 28m vs 36m.)
  pull_request:
    branches: [main]
    paths:
      # Everything that decides what the native wheel contains or whether its driver loads:
      #
      # - pyproject.toml, for the same reason it is in core's filter: the whole
      #   [tool.cibuildwheel] block lives there -- the per-platform `before-all` entries that
      #   invoke these very build scripts, the `repair-wheel-command`s, the manylinux images,
      #   `build`/`skip`/`archs` -- plus [tool.setuptools.package-data], the one line that puts
      #   the compiled driver into the wheel at all.
      # - src/pyramids_lazy/__init__.py, which is NOT just library code: on Windows it prepends
      #   the installed gdalplugins/ directory to PATH (and calls add_dll_directory), and that is
      #   the only thing that lets GDAL resolve the plugin's self-vendored Arrow DLLs, since
      #   Windows has no $ORIGIN. Break that block and the wheel installs and then fails to load
      #   the driver; `verify windows AMD64` is the only check that catches it, and it is one of
      #   the legs that went red on main in run 44936415149. Linux and macOS bake the directory
      #   into the plugin via rpath, so they would not notice.
      #
      # Cost, measured rather than assumed: 19 of the 40 commits before this change touched
      # pyproject.toml and 7 touched __init__.py, so roughly half of human PRs now pay a 15-job
      # run (86 job-minutes on this branch's own pull_request run, 45890484216). The automated
      # `cz bump` release PR does NOT: it is opened with secrets.GITHUB_TOKEN, and a
      # GITHUB_TOKEN-created pull request starts no workflow runs (PR #39 reports no checks at
      # all). The release wheels are built by the workflow_run arm after github-release instead.
      - "pyproject.toml"
      - "src/pyramids_lazy/__init__.py"
      - "ci/parquet-plugin/**"
      - "setup.py"
      - ".github/workflows/bundle-pypi-wheels.yml"
  workflow_run:
    workflows: ["github-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / ref to build wheels from (defaults to the ref selected in the UI)"
        required: false
        default: ""
        type: string
      core-version:
        description: "pyramids-core version to build against (blank = the pinned default)"
        required: false
        default: ""
        type: string
      gdal-version:
        description: "override the GDAL version derived from the core wheel's soname"
        required: false
        default: ""
        type: string
      arrow-version:
        description: "Arrow C++ version to build"
        required: false
        default: ""
        type: string
      dry_run_release:
        description: "Also run the release job's gather + composition gate (stops before upload/publish)"
        required: false
        default: false
        type: boolean

# The core release the wheels build and link against. Pinned, not "latest": the GDAL version is
# derived from whatever core serves and only the exact tarballs in build.sh's digest table are
# accepted, so "latest" would fail this workflow on an unrelated PR the moment core bumps GDAL.
# Bump together with the digest table. 0.81.0 is the release that ships the gdal_plugin_path seam
# this wheel registers through.
env:
  PINNED_CORE_VERSION: "0.81.0"
  # The GDAL the pinned core links. Linux/macOS derive it from the downloaded
  # libgdal; Windows cannot (its gdal-<hash>.dll carries no version), so it is
  # passed explicitly. Bump together with core and the digest table.
  PINNED_GDAL_VERSION: "3.13.3"

concurrency:
  # Per-run group (unique run_id) for push / workflow_run so a merge to main or a release is
  # always built to completion; only pull_request builds share a per-branch group and cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-ref:
    name: resolve the release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    # core's workflow_run guard: a workflow_run event builds only if it came from a SUCCESSFUL
    # same-repo github-release; EVERY other event (push, pull_request, workflow_dispatch -- and
    # any trigger added later) passes. Downstream jobs `needs: resolve-ref`, so they skip when
    # this skips. The `case` block below is what decides the ref per event, and it has a `*` arm
    # for exactly that reason.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Download the release ref from the github-release run
        # On the release (workflow_run) path head_branch/head_sha point at the pre-bump main:
        # github-release creates a release/auto-* branch and pushes the version bump THERE, then
        # uploads that branch name as the `release-ref` artifact. Fetch it so the wheels build the
        # tip that actually holds the bump -- exactly what pypi-release.yml does, and NOT
        # head_branch/head_sha (which would build main).
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ref
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .release-ref
      - name: Resolve the ref to build
        id: ref
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_run) REF="$(cat .release-ref/release-ref.txt)" ;;
            workflow_dispatch) REF="${{ inputs.branch || github.ref_name }}" ;;
            # On a PR, github.ref_name is the UNQUALIFIED "<pr_number>/merge". actions/checkout
            # treats an unqualified ref as branch-or-tag (getCheckoutInfo in src/ref-helper.ts):
            # neither refs/heads/<n>/merge nor a tag of that name exists, so it fails with
            # "A branch or tag with the name '<n>/merge' could not be found" -- every build job
            # dies at step one. Qualify it to the merge ref the PR event actually points at.
            pull_request) REF="refs/pull/${{ github.event.pull_request.number }}/merge" ;;
            *) REF="${{ github.ref_name }}" ;;
          esac
          echo "resolved ref: ${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"


  build-linux-wheels:
    name: linux ${{ matrix.arch }}
    needs: resolve-ref
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # before-all (build.sh) runs inside the manylinux container; pass what it needs in.
          CIBW_ENVIRONMENT: >-
            PYRAMIDS_LAZY_NATIVE=1 PYRAMIDS_LAZY_PUBLISH=1 OUTPUT=/tmp/pp-out
            PLAT=manylinux_2_28_${{ matrix.arch }}
            CORE_VERSION=${{ inputs.core-version || env.PINNED_CORE_VERSION }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  build-macos-wheels:
    name: macos ${{ matrix.arch }}
    needs: resolve-ref
    # Build each arch NATIVELY: arm64 on macos-15, x86_64 on macos-15-intel. GitHub retired the
    # macos-13 Intel image on 2025-12-04 (jobs pinned to it queue forever), and macos-15-intel is
    # the replacement native x86_64 image (supported into 2027). Native beats cross-compiling
    # x86_64 on the arm64 runner, which made Arrow's bundled boost fail at configure (source_group).
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-15
          - arch: x86_64
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: >-
            PYRAMIDS_LAZY_NATIVE=1 PYRAMIDS_LAZY_PUBLISH=1 OUTPUT=/tmp/pp-out
            PLAT=macosx_11_0_${{ matrix.arch }}
            CORE_VERSION=${{ inputs.core-version || env.PINNED_CORE_VERSION }}
            MACOSX_DEPLOYMENT_TARGET=11.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  build-windows-wheels:
    name: windows AMD64
    needs: resolve-ref
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: >-
            PYRAMIDS_LAZY_NATIVE=1 PYRAMIDS_LAZY_PUBLISH=1 OUTPUT=C:/pp-out
            PLAT=win_amd64
            CORE_VERSION=${{ inputs.core-version || env.PINNED_CORE_VERSION }}
            GDAL_VERSION=${{ inputs.gdal-version || env.PINNED_GDAL_VERSION }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows-AMD64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: sdist (pure)
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the sdist
        # No plugin staged and PYRAMIDS_LAZY_NATIVE unset, so this is the ordinary pure source
        # dist; a source install on an unsupported platform gets the pure backend and the
        # OGR-Parquet path raises its branded hint. PYRAMIDS_LAZY_PUBLISH=1 caps Requires-Python at
        # <3.15 (see setup.py) so pip refuses the sdist on 3.15 too -- otherwise pip would skip the
        # capped wheels and fall through to an uncapped sdist, defeating the clean refusal.
        env:
          PYRAMIDS_LAZY_PUBLISH: "1"
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build
          python -m build --sdist --outdir dist
          test -z "$(tar tzf dist/*.tar.gz | grep gdalplugins || true)" \
            || { echo "sdist must not carry gdalplugins/" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Every verify job checks out `needs.resolve-ref.outputs.ref` and so declares resolve-ref,
  # even though build-linux-wheels already depends on it: an undeclared need renders the
  # expression EMPTY rather than failing, and checkout then falls back to github.ref. That is
  # the same ref on a push or a pull request, but on the release path github.ref is the default
  # branch while the wheel is built from the release/auto-* branch carrying the version bump --
  # so verify.py WOULD HAVE RUN from a different tree than the wheel it was verifying. Latent, not
  # historical: this workflow has never run on a workflow_run event (every run so far is a push,
  # a pull_request or a workflow_dispatch), and 0.1.0/0.1.1/0.2.0 all predate it, so no published
  # wheel was verified against the wrong tree. The first release through this arm would have been.
  verify-debian12:
    name: verify debian12 (glibc)
    needs: [resolve-ref, build-linux-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: python:3.12-slim-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-x86_64
          path: wheelhouse
      - name: Install the wheel (pulls pyramids-core) and verify the driver loads
        shell: bash
        run: |
          set -euo pipefail
          ldd --version | head -1 || true
          pip install "$(ls wheelhouse/*.whl)" --only-binary=:all:
          python ci/parquet-plugin/verify.py --via-entry-point

  verify-rocky9:
    name: verify rocky9 (glibc)
    needs: [resolve-ref, build-linux-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: rockylinux:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-x86_64
          path: wheelhouse
      - name: Install python + the wheel, verify the driver loads
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y python3.12 python3.12-pip >/dev/null
          python3.12 -m pip install "$(ls wheelhouse/*.whl)" --only-binary=:all:
          python3.12 ci/parquet-plugin/verify.py --via-entry-point

  verify-rocky9-aarch64:
    name: verify rocky9 aarch64 (glibc)
    needs: [resolve-ref, build-linux-wheels]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: rockylinux:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-aarch64
          path: wheelhouse
      - name: Install python + the wheel, verify the driver loads
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y python3.12 python3.12-pip >/dev/null
          python3.12 -m pip install "$(ls wheelhouse/*.whl)" --only-binary=:all:
          python3.12 ci/parquet-plugin/verify.py --via-entry-point

  verify-macos:
    name: verify macos ${{ matrix.arch }}
    needs: [resolve-ref, build-macos-wheels]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-15
          - arch: x86_64
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse
      - name: Install the wheel, verify the driver loads
        run: |
          set -euo pipefail
          python -m pip install "$(ls wheelhouse/*.whl)" --only-binary=:all:
          python ci/parquet-plugin/verify.py --via-entry-point

  verify-windows:
    name: verify windows AMD64
    needs: [resolve-ref, build-windows-wheels]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-windows-AMD64
          path: wheelhouse
      - name: Install the wheel, verify the driver loads
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "$(ls wheelhouse/*.whl)" --only-binary=:all:
          python ci/parquet-plugin/verify.py --via-entry-point

  test-native-wheel:
    # Runs the actual test suite against the PUBLISHED native wheel the way a pip user installs it
    # (actions/setup-python + `pip --only-binary=:all:`, NOT the conda/pixi dev env). The verify-*
    # jobs only smoke-test that the OGR-Parquet driver loads; this exercises the whole suite against
    # the real artifact, across the supported Python range (Linux) and all three OS wheels. 3.15 is
    # deliberately absent: the published wheel caps Requires-Python at <3.15 (see setup.py), so it
    # cannot install there -- that path is probed non-gating in pypi-install-test.yml instead.
    name: suite native wheel ${{ matrix.os }} py${{ matrix.python-version }}
    needs: [resolve-ref, build-linux-wheels, build-macos-wheels, build-windows-wheels]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # onlybinary is "--only-binary=:all:" on the bare legs (the published-wheel contract: every
          # runtime dep must resolve from a wheel, as pure-wheel-test's core job asserts) but empty on
          # the [parquet] leg, matching pure-wheel-test's extras job, which installs the extra WITHOUT
          # --only-binary so a transitive sdist-only dep of pyarrow/dask-geopandas cannot block this
          # release gate (both jobs gate the release; keeping the same contract avoids the asymmetry).
          - { os: ubuntu-latest, artifact: wheels-linux-x86_64, python-version: "3.11", extra: "", onlybinary: "--only-binary=:all:" }
          - { os: ubuntu-latest, artifact: wheels-linux-x86_64, python-version: "3.12", extra: "", onlybinary: "--only-binary=:all:" }
          # One leg installs the [parquet] extra so the OGR-Parquet suite runs through the bundled
          # driver end to end (the extra provides pyarrow to write the fixture); 3.13 matches the
          # pure-wheel-test extras leg, where the pyarrow/dask-geopandas wheels are known-present.
          - { os: ubuntu-latest, artifact: wheels-linux-x86_64, python-version: "3.13", extra: "[parquet]", onlybinary: "" }
          - { os: ubuntu-latest, artifact: wheels-linux-x86_64, python-version: "3.14", extra: "", onlybinary: "--only-binary=:all:" }
          - { os: macos-15, artifact: wheels-macos-arm64, python-version: "3.12", extra: "", onlybinary: "--only-binary=:all:" }
          - { os: windows-2022, artifact: wheels-windows-AMD64, python-version: "3.12", extra: "", onlybinary: "--only-binary=:all:" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the native wheel as a pip user would, then run the suite
        # matrix.onlybinary is --only-binary=:all: on the bare legs (every runtime dep -- pyramids-core,
        # dask, zarr, kerchunk, h5py, ... -- must resolve from a published wheel on this OS/Python) and
        # empty on the [parquet] leg, matching pure-wheel-test's extras job (see the matrix comment).
        # -o pythonpath= clears pyproject's `pythonpath = [".", "src"]` so tests import the INSTALLED
        # wheel, not the source tree. interop (xarray) is a test-only dep absent from the wheel, and
        # live needs the network -- both deselected (they run in tests.yml's pixi interop env).
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls wheelhouse/*.whl)
          pip install "${WHEEL}${{ matrix.extra }}" ${{ matrix.onlybinary }}
          pip install pytest pytest-env pytest-mock --only-binary=:all:
          python -c "import pyramids_lazy; print('installed', pyramids_lazy.__version__)"
          pytest -vvv -o pythonpath= -m "not live and not interop" tests/

  verify-sdist-pure-backend:
    # The sdist is what a pip user on an UNSUPPORTED platform (musllinux, win_arm64) falls back to:
    # no bundled driver, the pure backend. conda-forge ships no musl/win-arm64 libgdal-core, so that
    # exact platform cannot pip-install the stack here; instead we force the pure path on glibc by
    # building pyramids-lazy from the real sdist artifact (--no-binary) while its deps stay wheels.
    # Asserts the degraded contract: imports, carries NO gdalplugins/, and iter_features over a
    # .parquet raises (no silent success) rather than loading a driver it does not have.
    name: verify sdist pure backend
    needs: [resolve-ref, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the sdist (pure backend) and assert the degraded contract
        shell: bash
        run: |
          set -euo pipefail
          # --no-binary=pyramids-lazy forces the sdist to build (the pure backend, no gdalplugins);
          # --only-binary=:all: keeps every dependency a published wheel. [parquet] pulls pyarrow so
          # the assertion below can write a GeoParquet fixture.
          pip install "$(ls dist/*.tar.gz)[parquet]" --only-binary=:all: --no-binary=pyramids-lazy
          python - <<'PY'
          import importlib.util, pathlib, tempfile, os
          spec = importlib.util.find_spec("pyramids_lazy")
          pkg = pathlib.Path(spec.origin).parent
          assert not (pkg / "gdalplugins").exists(), f"pure sdist install must not carry gdalplugins/: {pkg}"
          import pyramids_lazy
          print("pure backend OK:", pyramids_lazy.__version__, "@", pkg, "(no gdalplugins/)")

          import pyramids  # vendored-GDAL bootstrap must run before osgeo/geopandas/shapely
          import geopandas as gpd
          from shapely.geometry import Point
          from pyramids.feature import FeatureCollection

          path = os.path.join(tempfile.mkdtemp(), "points.parquet")
          gpd.GeoDataFrame(
              {"i": [0, 1, 2]}, geometry=[Point(x, x) for x in range(3)], crs="EPSG:4326"
          ).to_parquet(path)
          print("read_parquet works on the pure backend:", len(FeatureCollection.read_parquet(path)), "features")
          try:
              list(FeatureCollection.iter_features(path))
          except Exception as exc:  # any raise satisfies the contract (no OGR driver -> must not succeed)
              print("iter_features correctly raised without the OGR driver:",
                    type(exc).__name__, "-", str(exc)[:200])
          else:
              raise SystemExit("iter_features over parquet must NOT silently succeed without the OGR driver")
          PY

  report:
    name: report
    # resolve-ref is listed because the `if` below reads needs.resolve-ref.result: an
    # undeclared need renders null, `null != 'skipped'` is true, and the guard would be a
    # no-op dressed up as a condition.
    needs:
      [resolve-ref, build-linux-wheels, build-macos-wheels, build-windows-wheels, sdist]
    if: always() && needs.resolve-ref.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
        continue-on-error: true
      - name: Summarise what was produced
        run: |
          {
            echo "## pyramids-lazy native wheels"
            echo
            echo "| artifact | size |"
            echo "|---|---|"
            shopt -s nullglob
            for f in artifacts/*/*.whl artifacts/*/*.tar.gz; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish to PyPI + attach to the GitHub release
    # Every build + verify job gates the publish: a red verify must stop the release, not merely
    # mark the run failed. Mirrors pyramids-core's bundle release job.
    needs:
      [build-linux-wheels, build-macos-wheels, build-windows-wheels, sdist,
       verify-debian12, verify-rocky9, verify-rocky9-aarch64, verify-macos, verify-windows,
       test-native-wheel, verify-sdist-pure-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publish only after a SUCCESSFUL same-repo github-release (the canonical path). A manual
    # dispatch with dry_run_release runs the gather + composition gate and then STOPS before any
    # upload/publish -- how the release plumbing is exercised without cutting a release. Neither a
    # plain push to main nor a pull request satisfies this `if`: both build + verify and publish
    # nothing, so opening a PR against the build can never upload a wheel.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run_release)
    permissions:
      contents: write
    steps:
      - name: Download release artifacts from this run
        # Every build job uploads a unique name (sdist, wheels-<os>-<arch>); download-artifact v4+
        # `merge-multiple` collects them all into dist/. Keep the per-job names unique if the build
        # matrix grows.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          pattern: "{sdist,wheels-*}"
          merge-multiple: true

      - name: List artifacts about to be released
        run: ls -lah dist/

      - name: Assert release composition before publishing
        # pyramids-lazy ships ONE py3-none wheel per platform (not per CPython), so the expected
        # set is exactly 1 sdist + 5 wheels: manylinux x86_64/aarch64, macOS arm64/x86_64, win_amd64.
        # A partial gather (a missing platform artifact) fails here instead of publishing short.
        # Counting uses nullglob arrays, never `ls | wc -l` (a zero-match ls exits 2 under pipefail).
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 sdist, found ${#sdists[@]}" >&2; fail=1
          fi
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 5 ]; then
            echo "ERROR: expected 5 wheels, found ${#wheels[@]}" >&2; fail=1
          fi
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 "macosx*arm64" "macosx*x86_64" win_amd64; do
            plat=(dist/*${tag}.whl)
            if [ "${#plat[@]}" -ne 1 ]; then
              echo "ERROR: expected 1 ${tag} wheel, found ${#plat[@]}" >&2; fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "release composition check FAILED -- nothing was published" >&2; exit 1
          fi
          echo "release composition OK: 1 sdist + ${#wheels[@]} wheels (one per platform)"

      - name: Dry run stops here -- gather + gate passed, nothing published
        if: github.event_name == 'workflow_dispatch'
        run: echo "release dry run OK (composition gate passed); upload/publish skipped"

      - name: Resolve target release tag
        if: github.event_name == 'workflow_run'
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo '${{ github.repository }}' --json tagName --jq '.tagName')
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attach wheels + sdist to the GitHub release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload '${{ steps.release-tag.outputs.tag }}' \
              dist/*.whl dist/*.tar.gz \
              --repo '${{ github.repository }}' \
              --clobber

      - name: Publish to PyPI
        if: github.event_name == 'workflow_run'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_PUBLISH }}
          packages-dir: dist/
          skip-existing: true
          verbose: true
