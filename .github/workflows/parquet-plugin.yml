name: Parquet Plugin - Build & Verify

# Builds GDAL's OGR Parquet driver as a standalone plugin and packages it as the
# `pyramids-lazy-parquet` platform wheel. See planning/parquet-plugin-plan.md for why this is a
# separate distribution (pyramids-lazy's own wheel must stay pure) and why the plugin is linked
# directly against the libgdal inside a published pyramids-core wheel rather than relinked after
# the fact.
#
# Not wired into the release flow yet: this runs on demand and on pull requests that touch the
# build, so the pipeline can be proven before anything is published. Phase 1 is manylinux only;
# macOS, musllinux and win_amd64 follow (plan §Phases), and win_arm64 is excluded because vcpkg
# compiles Arrow into libgdal there.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      core-version:
        description: "pyramids-core version to build against (blank = latest on PyPI)"
        required: false
        default: ""
        type: string
      plugin-version:
        description: "version to stamp on the produced wheel"
        required: false
        default: "0.1.0.dev0"
        type: string
  pull_request:
    paths:
      - "ci/parquet-plugin/**"
      - ".github/workflows/parquet-plugin.yml"
      - "planning/parquet-plugin-plan.md"

concurrency:
  group: parquet-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.plat }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: manylinux_2_28_x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
            runner: ubuntu-latest
          - plat: manylinux_2_28_aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the plugin inside ${{ matrix.image }}
        # The same image pyramids-core's Linux wheels are built in, so the plugin lands at the
        # same libc floor as the wheel it links against.
        run: |
          set -euo pipefail
          mkdir -p out dist
          docker run --rm \
            -v "$PWD:/src" -v "$PWD/out:/out" \
            -e CORE_VERSION="${{ inputs.core-version }}" \
            -e PLAT="${{ matrix.plat }}" \
            -e OUTPUT=/out \
            "${{ matrix.image }}" \
            bash /src/ci/parquet-plugin/build.sh

      - name: Package the wheel
        run: |
          set -euo pipefail
          CORE_WHEEL="$(cat out/core-wheel.txt)"
          # Pin to the exact core release the binaries were linked against: a different core
          # build may carry a different libgdal soname, and then the plugin cannot load.
          CORE_VER="$(printf '%s' "$CORE_WHEEL" | sed -E 's/^pyramids_core-([^-]+)-.*/\1/')"
          python3 ci/parquet-plugin/make_wheel.py \
            --stage out \
            --version "${{ inputs.plugin-version || '0.1.0.dev0' }}" \
            --plat "${{ matrix.plat }}" \
            --core-requires "pyramids-core==${CORE_VER}" \
            --outdir dist

      - name: Verify against a clean install
        # x86_64 only: the arm runner cannot install the x86_64 core wheel, and vice versa, so
        # the aarch64 wheel is verified by the same script on an arm runner via the matrix.
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install -q --upgrade pip
          /tmp/venv/bin/python -m pip install -q "$(ls dist/*.whl)"
          /tmp/venv/bin/python ci/parquet-plugin/verify.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parquet-plugin-${{ matrix.plat }}
          path: |
            dist/*.whl
            out/core-soname.txt
            out/core-wheel.txt
          if-no-files-found: error
          retention-days: 14

  report:
    name: report
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Summarise what was produced
        run: |
          {
            echo "## Parquet plugin wheels"
            echo
            echo "| wheel | size | linked libgdal |"
            echo "|---|---|---|"
            for d in artifacts/*/; do
              whl=$(find "$d" -name '*.whl' | head -1)
              [ -n "$whl" ] || continue
              soname=$(cat "$d/out/core-soname.txt" 2>/dev/null || echo "?")
              size=$(du -h "$whl" | cut -f1)
              echo "| \`$(basename "$whl")\` | $size | \`$soname\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
