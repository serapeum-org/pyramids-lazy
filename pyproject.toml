[project]
name = "pyramids-lazy"
version = "0.1.0"
description = "Lazy / dask compute backend for pyramids (the pyramids.compute_backend plugin)"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "GNU General Public License v3" }
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
keywords = ["GIS", "gdal", "dask", "zarr", "lazy", "pyramids"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

# No GDAL here: the plugin inherits pyramids-core's vendored GDAL (constraint C2). Declaring GDAL
# would risk a second, ABI-mismatched libgdal on the path.
dependencies = [
    "pyramids-core>=0.74.0",
    "dask>=2024.1.0",
    "distributed>=2024.1.0",
    "zarr>=3",
    "fsspec>=2024.1.0",
    "s3fs>=2024.1.0",
    # kerchunk + h5py for the NetCDF/HDF5 lazy (Zarr-reference) path.
    "kerchunk>=0.2.10",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
# The OGR-Parquet vector-lazy subset: dask-geopandas + pyarrow only.
parquet = ["pyarrow>=10.0.0", "dask-geopandas>=0.5.0"]

# How pyramids-core discovers this backend. core's require_compute_backend() resolves the
# pyramids.compute_backend group and routes every lazy/dask operation to the object below.
[project.entry-points."pyramids.compute_backend"]
lazy = "pyramids_lazy.backend:backend"

[project.urls]
Homepage = "https://github.com/serapeum-org/pyramids-lazy"
Repository = "https://github.com/serapeum-org/pyramids-lazy"

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
# "." makes the relocated-from-core ``tests`` package importable (the suite uses
# ``from tests._marks import ...`` etc.); "src" exposes ``pyramids_lazy``.
pythonpath = [".", "src"]
testpaths = ["tests"]
timeout = 300
faulthandler_timeout = 120
# Marker set carried over from pyramids-core so the relocated extras-gated tests register and
# auto-skip (via tests/_marks.py + conftest) when an extra's headline dep is absent.
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "core: extras-free test (auto-applied when no extras marker is present)",
    "plot: tests requiring the [viz] extra (cleopatra) — plotting tests",
    "lazy: tests requiring the [lazy] extra (dask, distributed, zarr, fsspec)",
    "interop: tests requiring the optional interop peer dependency",
    "netcdf_lazy: tests requiring kerchunk + h5py",
    "parquet: tests requiring the [parquet] extra (pyarrow)",
    "parquet_lazy: tests requiring dask-geopandas",
    "stac: tests requiring the [stac] extra (pystac-client)",
    "live: live network test against a real external service",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E", "F", "W", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pyramids_lazy"]
explicit_package_bases = true
# pyramids-core is only typed via its own package; the plugin reaches it through the
# pyramids.lazy_support facade. Missing third-party stubs collapse to Any.
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
# These modules are moved verbatim from pyramids-core, where the identical call sites are covered by
# its `pyramids.dataset.ops.*` / netcdf-engine mypy overrides (np.dtype passed where a str is
# annotated, a general float tuple into GeoReference's 6-tuple, dynamic engine dispatch, ...). Mirror
# that suppression so the relocation is type-clean rather than re-typing moved code.
module = [
    "pyramids_lazy._zarr",
    "pyramids_lazy._collection_zarr",
    "pyramids_lazy._lazy",
    "pyramids_lazy._lazy_cube",
    "pyramids_lazy._to_dask_dataframe",
]
disable_error_code = [
    "attr-defined",
    "call-arg",
    "misc",
    "return-value",
    "assignment",
    "union-attr",
    "no-any-return",
    "arg-type",
]
