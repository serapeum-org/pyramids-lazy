[project]
name = "pyramids-lazy"
version = "0.1.0"
description = "Lazy / dask compute backend for pyramids (the pyramids.compute_backend plugin)"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "GNU General Public License v3" }
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
keywords = ["GIS", "gdal", "dask", "zarr", "lazy", "pyramids"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

# No GDAL here: the plugin inherits pyramids-core's vendored GDAL (constraint C2). Declaring GDAL
# would risk a second, ABI-mismatched libgdal on the path.
dependencies = [
    # A floor cannot express "must publish the pyramids.lazy_support facade", which no released
    # core does yet; pyramids_lazy._seam checks it at import. Raise this to the first release
    # that ships the facade.
    "pyramids-core>=0.74.0",
    "dask>=2024.1.0",
    "distributed>=2024.1.0",
    "zarr>=3",
    "fsspec>=2024.1.0",
    "s3fs>=2024.1.0",
    # kerchunk + h5py for the NetCDF/HDF5 lazy (Zarr-reference) path.
    "kerchunk>=0.2.10",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
# The OGR-Parquet vector-lazy subset: dask-geopandas + pyarrow only.
parquet = ["pyarrow>=10.0.0", "dask-geopandas>=0.5.0"]

# How pyramids-core discovers this backend. core's require_compute_backend() resolves the
# pyramids.compute_backend group and routes every lazy/dask operation to the object below.
[project.entry-points."pyramids.compute_backend"]
lazy = "pyramids_lazy.backend:backend"

[project.urls]
Homepage = "https://github.com/serapeum-org/pyramids-lazy"
Repository = "https://github.com/serapeum-org/pyramids-lazy"

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.6.0",
    "pytest-mock>=3.12.0",
    "coverage",
    "mypy>=1.11.0",
    "ruff>=0.15.22",
    # Docstring gate. Pinned to the version the pre-commit `pydocstyle` hook uses so
    # `pixi run -e dev pydocstyle` matches what the hook and CI enforce.
    "pydocstyle==6.3.0",
    "nbval>=0.11.0",
    "pre-commit>=3.7.1",
    "pre-commit-hooks>=4.6.0",
    # `pip` so `python -m pip freeze` works in the conda-based pixi envs — the pip-audit workflow
    # relies on it, and a bare conda env does not ship pip.
    "pip",
    # Release tooling (driven from the pixi `cz-bump` / `build-dist` / `publish-pypi` tasks
    # and the github-release / pypi-release workflows).
    "commitizen>=4.8.4",
    "build>=1.0.0",
    "twine>=5.0.0",
    # pyramids-core publishes the seam this backend implements, unreleased, so it is pinned by
    # commit (not the branch): with `--locked` CI, a branch ref would make this lock stale and fail
    # setup the moment core's branch moves, and the commit stops being fetchable once that branch is
    # deleted. Symmetric with how core pins this package. Bump deliberately when core advances, and
    # replace the whole entry with `pyramids-core>=<rel>` once core ships the seam.
    "pyramids-core @ git+https://github.com/serapeum-org/pyramids-core.git@9de391a35e3199643f575fe7436ecdfa4b281896",
]
# The MkDocs + mike documentation stack. Resolved by the `docs` pixi environment and the
# github-pages-mkdocs workflow; mirrors pyramids-mesh. No docs site exists yet, so this group
# is dormant until a `mkdocs.yml` + `docs/` tree land (see the workflow header).
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.5",
    "mike>=2.1.3",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-autorefs>=1.2",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-table-reader-plugin>=3.1.0",
    "mkdocs-mermaid2-plugin>=1.2.1",
]

# GDAL and the HDF5-linking libs must come from conda-forge so they share one native stack.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
gdal = "*"
libgdal-netcdf = "*"
geopandas = "*"
"dask-core" = ">=2024.1.0"
distributed = ">=2024.1.0"
zarr = ">=3"
fsspec = ">=2024.1.0"
s3fs = ">=2024.1.0"
kerchunk = ">=0.2.10"
h5py = ">=3.8.0,<3.17"
hdf5 = "1.14.*"

# The lazy *vector* path only; kept out of the base deps so an env can be built without it. That
# env is the shape core's py311-py315 legs run in, and the shape that surfaced the backend-discovery
# bug the single all-extras env hid.
[tool.pixi.feature.parquet.dependencies]
dask-geopandas = ">=0.5.0"
pyarrow = ">=10.0.0"

# Pin an interpreter so CI can run the 3.11 leg, where runtime_checkable isinstance behaves
# differently (hasattr vs getattr_static) — the version the backend-discovery bug was specific to.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.pypi-dependencies]
pyramids-lazy = { path = ".", editable = true }

[tool.pixi.environments]
# dev: everything, including the vector extra. base: the no-[parquet] shape. py311: base on 3.11.
# docs: dev plus the MkDocs stack, in its own solve-group so the docs libraries never perturb the
# dev/base/py311 locks.
dev = { features = ["dev", "parquet"], solve-group = "default" }
base = { features = ["dev"], solve-group = "base" }
py311 = { features = ["dev", "py311"], solve-group = "py311" }
docs = { features = ["dev", "docs"], solve-group = "docs" }

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest -vvv", description = "Run the test suite" }
# main / test-all: coverage-producing runs (XML for Codecov, term-missing for local reading),
# mirroring the shared pixi task names across the org's repos.
main = { cmd = "pytest -vvv --cov=src/pyramids_lazy -m 'not live' --cov-report=xml", description = "Run the main test suite with coverage" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids_lazy --cov-report=xml --cov-report=term-missing", description = "Run the whole suite with coverage" }
lint = { cmd = "ruff check . && ruff format --check .", description = "Lint and format check" }
pydocstyle = { cmd = "pydocstyle --convention=google --add-ignore=D403 src/pyramids_lazy", description = "Docstring style check" }
precommit = { cmd = "pre-commit run --all-files", description = "Run all pre-commit hooks" }
typecheck = { cmd = "mypy", description = "Type-check the package" }
# No notebooks yet; the task is wired for parity and runs once docs/examples exists.
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "Execute example notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate the changelog with commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }

[tool.pytest.ini_options]
# "." makes the relocated-from-core ``tests`` package importable (the suite uses
# ``from tests._marks import ...`` etc.); "src" exposes ``pyramids_lazy``.
pythonpath = [".", "src"]
testpaths = ["tests"]
faulthandler_timeout = 300
# Abort (and fail) a hung run rather than only dumping tracebacks: the bare faulthandler_timeout
# does not fail the run on its own, so removing the old pytest-timeout `timeout` lost that.
faulthandler_exit_on_timeout = true
# Marker set carried over from pyramids-core so the relocated extras-gated tests register and
# auto-skip (via tests/_marks.py + conftest) when an extra's headline dep is absent.
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "core: extras-free test (auto-applied when no extras marker is present)",
    "plot: tests requiring the [viz] extra (cleopatra) — plotting tests",
    "lazy: tests requiring the [lazy] extra (dask, distributed, zarr, fsspec)",
    "interop: tests requiring the optional interop peer dependency",
    "netcdf_lazy: tests requiring kerchunk + h5py",
    "parquet: tests requiring the [parquet] extra (pyarrow)",
    "parquet_lazy: tests requiring dask-geopandas",
    "stac: tests requiring the [stac] extra (pystac-client)",
    "live: live network test against a real external service",
]

[tool.pydocstyle]
# Google-style docstrings; D403 relaxed for the one verbatim-relocated docstring that opens
# with "dask's ..." (relocated bodies are not re-typed here — see CLAUDE.md). Kept in step with
# the pre-commit pydocstyle hook's args.
convention = "google"
add_ignore = "D403"
match = '(?!test_).*\.py'

[tool.coverage.run]
# Branch coverage, measured wherever the suite runs (the pixi tasks and the pre-commit
# pytest-check hook alike), not just line coverage.
branch = true
source = ["src/pyramids_lazy"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E", "F", "W", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pyramids_lazy"]
explicit_package_bases = true
# pyramids-core is only typed via its own package; the plugin reaches it through the
# pyramids.lazy_support facade. Missing third-party stubs collapse to Any.
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests/"]
