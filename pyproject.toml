[project]
name = "pyramids-lazy"
version = "0.2.0"
description = "Lazy / dask compute backend for pyramids (the pyramids.compute_backend plugin)"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "GNU General Public License v3" }
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
keywords = ["GIS", "gdal", "dask", "zarr", "lazy", "pyramids"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

# No GDAL here: the plugin inherits pyramids-core's vendored GDAL (constraint C2). Declaring GDAL
# would risk a second, ABI-mismatched libgdal on the path.
dependencies = [
    # 0.81.0 is the release that routes the dataset lazy ops through the compute-backend seam and
    # re-exports the reduce_axis / _SUPPORTED_OPS / _NAN_TABLE primitives this backend imports
    # (serapeum-org/pyramids-core#1590); an older core resolves but is missing those symbols.
    "pyramids-core>=0.81.0",
    "dask>=2024.1.0",
    "distributed>=2024.1.0",
    "zarr>=3",
    "fsspec>=2024.1.0",
    "s3fs>=2024.1.0",
    # kerchunk + h5py for the NetCDF/HDF5 lazy (Zarr-reference) path.
    "kerchunk>=0.2.10",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
# The OGR-Parquet vector-lazy subset. pixi's `parquet` feature maps to this same-named extra.
parquet = ["pyarrow>=10.0.0", "dask-geopandas>=0.5.0"]

# How pyramids-core discovers this backend. core's require_compute_backend() resolves the
# pyramids.compute_backend group and routes every lazy/dask operation to the object below.
[project.entry-points."pyramids.compute_backend"]
lazy = "pyramids_lazy.backend:backend"

[project.urls]
Homepage = "https://github.com/serapeum-org/pyramids-lazy"
Repository = "https://github.com/serapeum-org/pyramids-lazy"
Documentation = "https://serapeum-org.github.io/pyramids-lazy/"

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.6.0",
    "pytest-mock>=3.12.0",
    "coverage",
    "mypy>=1.11.0",
    "ruff>=0.15.22",
    # Docstring gate. Pinned to the version the pre-commit `pydocstyle` hook uses so
    # `pixi run -e dev pydocstyle` matches what the hook and CI enforce.
    "pydocstyle==6.3.0",
    "nbval>=0.11.0",
    "pre-commit>=3.7.1",
    "pre-commit-hooks>=4.6.0",
    # `pip` so `python -m pip freeze` works in the conda-based pixi envs — the pip-audit workflow
    # relies on it, and a bare conda env does not ship pip.
    "pip",
    # Release tooling (driven from the pixi `cz-bump` / `build-dist` / `publish-pypi` tasks
    # and the github-release / pypi-release workflows).
    "commitizen>=4.8.4",
    "build>=1.0.0",
    "twine>=5.0.0",
    # Micro-benchmark harness for the performance suite under benchmarks/ (not a CI gate). Provides
    # the `benchmark` fixture + marker; only run via the `benchmark` task — benchmarks/ is outside
    # testpaths, so the normal test tasks never collect it.
    "pytest-benchmark>=5.1.0",
]
# The MkDocs + mike documentation stack. Resolved by the `docs` pixi environment and the
# github-pages-mkdocs workflow; mirrors pyramids-mesh. The site lives at `mkdocs.yml` + `docs/`.
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.5",
    "mike>=2.1.3",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-autorefs>=1.2",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-table-reader-plugin>=3.1.0",
    "mkdocs-mermaid2-plugin>=1.2.1",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
# macOS floor 14.0 so the pyproj cp311 arm64 wheel (tagged macosx_14_0) resolves instead of its sdist.
platforms = [
    "win-64",
    "linux-64",
    { platform = "osx-64", macos = "14.0" },
    { platform = "osx-arm64", macos = "14.0" },
]

# Interpreter only; <3.15 keeps the version-less dev/docs envs off 3.15 (no cp315 h5py wheel yet).
[tool.pixi.dependencies]
python = ">=3.11,<3.15"

# Interpreter pins, one feature per supported Python so CI can run a per-version matrix. 3.11 is the
# floor, where runtime_checkable isinstance behaves differently (hasattr vs getattr_static) — the
# version the backend-discovery bug was specific to. 3.13/3.14 carry a build glob excluding the
# free-threaded interpreter (conda build string `_cp313t` / `_cp314t`), which ships no matching
# GDAL/h5py stack; the plain `_cp313` / `_cp314` glob anchors on the non-free-threaded build.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }
[tool.pixi.feature.py314.dependencies]
python = { version = "3.14.*", build = "*_cp314" }

[tool.pixi.pypi-dependencies]
pyramids-lazy = { path = ".", editable = true }

[tool.pixi.environments]
# Per-Python full-stack legs (dev + the [parquet] vector extra) across every supported interpreter,
# plus `base` — the no-[parquet] shape on 3.11 that surfaced the backend-discovery bug the all-extras
# env hid (it shares py311's solve-group as the parquet-less subset). `dev` is the local
# newest-float convenience env; `docs` adds the MkDocs stack in its own solve-group so the docs
# libraries never perturb the test locks.
dev = { features = ["dev", "parquet"], solve-group = "default" }
base = { features = ["dev", "py311"], solve-group = "py311" }
py311 = { features = ["dev", "parquet", "py311"], solve-group = "py311" }
py312 = { features = ["dev", "parquet", "py312"], solve-group = "py312" }
py313 = { features = ["dev", "parquet", "py313"], solve-group = "py313" }
py314 = { features = ["dev", "parquet", "py314"], solve-group = "py314" }
docs = { features = ["dev", "docs"], solve-group = "docs" }

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest -vvv", description = "Run the test suite" }
# main / test-all: coverage-producing runs (XML for Codecov, term-missing for local reading),
# mirroring the shared pixi task names across the org's repos.
main = { cmd = "pytest -vvv --cov=src/pyramids_lazy --cov=ci/parquet-plugin -m 'not live' --cov-report=xml", description = "Run the main test suite with coverage" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids_lazy --cov=ci/parquet-plugin --cov-report=xml --cov-report=term-missing", description = "Run the whole suite with coverage" }
lint = { cmd = "ruff check . && ruff format --check .", description = "Lint and format check" }
pydocstyle = { cmd = "pydocstyle --convention=google --add-ignore=D403 src/pyramids_lazy", description = "Docstring style check" }
precommit = { cmd = "pre-commit run --all-files", description = "Run all pre-commit hooks" }
typecheck = { cmd = "mypy", description = "Type-check the package" }
# No notebooks yet; the task is wired for parity and runs once docs/examples exists.
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "Execute example notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate the changelog with commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }
# Performance benchmarks (benchmarks/, excluded from the normal test tasks). Extra args forward to
# pytest-benchmark, e.g. `pixi run -e dev benchmark --benchmark-autosave`.
benchmark = { cmd = "pytest benchmarks --benchmark-only --benchmark-columns=min,median,mean,stddev,rounds", description = "Run the performance benchmarks" }

[tool.pytest.ini_options]
# "." makes the relocated-from-core ``tests`` package importable (the suite uses
# ``from tests._marks import ...`` etc.); "src" exposes ``pyramids_lazy``.
pythonpath = [".", "src"]
testpaths = ["tests"]
faulthandler_timeout = 300
# Abort (and fail) a hung run rather than only dumping tracebacks: the bare faulthandler_timeout
# does not fail the run on its own, so removing the old pytest-timeout `timeout` lost that.
faulthandler_exit_on_timeout = true
# Marker set carried over from pyramids-core so the relocated extras-gated tests register and
# auto-skip (via tests/_marks.py + conftest) when an extra's headline dep is absent.
markers = [
    "core: extras-free test (auto-applied when no extras marker is present)",
    "lazy: tests requiring the dask/zarr lazy stack",
    "netcdf_lazy: tests requiring kerchunk + h5py",
    "parquet: tests requiring the [parquet] extra (pyarrow)",
    "parquet_lazy: tests requiring dask-geopandas",
    "live: live network test against a real external service",
]

[tool.pydocstyle]
# Google-style docstrings; D403 relaxed for the one verbatim-relocated docstring that opens
# with "dask's ..." (relocated bodies are not re-typed here — see CLAUDE.md). Kept in step with
# the pre-commit pydocstyle hook's args.
convention = "google"
add_ignore = "D403"
match = '(?!test_).*\.py'

[tool.coverage.run]
# Branch coverage, measured wherever the suite runs (the pixi tasks and the pre-commit
# pytest-check hook alike), not just line coverage.
branch = true
# ci/parquet-plugin is included deliberately: those three scripts decide what goes into a
# published wheel, tests/ci exercises them, and leaving them out meant coverage was
# reported as if they did not exist. NOTE: listing it here is not enough -- a `--cov=` on
# the command line REPLACES this setting, so every invocation that measures coverage has
# to name it too (the pixi tasks below and the pre-commit pytest hook all do).
source = ["src/pyramids_lazy", "ci/parquet-plugin"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E", "F", "W", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pyramids_lazy"]
explicit_package_bases = true
# pyramids-core is only typed via its own package; the plugin reaches it through the
# pyramids.lazy_support facade. Missing third-party stubs collapse to Any.
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests/"]
