site_name: pyramids-lazy
site_description: "The lazy / dask compute backend for pyramids: lazy reads, lazy cubes, Zarr, kerchunk and lazy vector"
site_url: https://serapeum-org.github.io/pyramids-lazy/
repo_url: https://github.com/serapeum-org/pyramids-lazy
repo_name: serapeum-org/pyramids-lazy
# Without this, content.action.edit builds edit links against the default `master`, and this
# repo's default branch is `main` — every page's edit pencil would 404.
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference
  icon:
    repo: fontawesome/brands/github


plugins:
  - search
  # mkdocs-jupyter is intentionally not registered: this site has no notebooks yet. The dependency
  # stays in the `docs` group, and this block comes back with the first docs/examples notebook.
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            # The lazy view classes are assembled over core's types and dask's, so most
            # members come from a base class rather than the class itself; mkdocstrings
            # defaults this to false, which silently drops them.
            inherited_members: true
  - table-reader
  - tags
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  # base_path reaches the repo root so docs/LICENSE.md can include the real LICENSE.md instead of
  # duplicating it; check_paths makes a broken include fail the build rather than render empty.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 1-4
      anchorlink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
  - Reference:
    - Overview: reference/index.md
    - Backend contract: reference/backend.md
    - Lazy raster reads: reference/lazy-array.md
    - Lazy NetCDF cube: reference/lazy-netcdf.md
    - Dask dataframe view: reference/dask-dataframe.md
    - Multi-file reads: reference/mfdataset.md
    - Kerchunk manifests: reference/kerchunk.md
    - Zarr (Dataset): reference/zarr.md
    - Zarr (DatasetCollection): reference/collection-zarr.md
    - Lazy vector reads: reference/vector-read.md
    - Lazy feature collection: reference/lazy-feature-collection.md
  - About:
    - Change-log: change-log.md
    - License: LICENSE.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/serapeum-org/pyramids-lazy
  version:
      provider: mike
